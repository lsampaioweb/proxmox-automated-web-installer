# Seeded from mac_bind in 03-proxmox-cluster host_vars.
# Host: pve-01.lan.home
# Primary NIC: enp2lacp0
# The service adds the password hash when it renders this file.
[global]
keyboard = "en-us"
country = "br"
fqdn = "pve-01.lan.home"
mailto = "root@pve-01.lan.home"
timezone = "America/Sao_Paulo"
root-password-hashed = "__PROXMOX_ROOT_PASSWORD_HASH__"
reboot-on-error = false
reboot-mode = "reboot"

[network]
source = "from-dhcp"

[network.interface-name-pinning]
enabled = true

[network.interface-name-pinning.mapping]
"60:be:b4:08:f7:66" = "enp2lacp0"
"60:be:b4:08:f7:67" = "enp2lacp1"
"60:be:b4:08:f7:68" = "enp2lacp2"
"60:be:b4:08:f7:69" = "enp2lacp3"

[disk-setup]
filesystem = "ext4"
# Placeholder only: replace disk-list with a stable selector before installation.
disk-list = ["sda"]

[first-boot]
source = "from-url"
ordering = "before-network"
url = "http://proxmox-auto-install-assistant.lan.homelab:8080/api/v1/first-boot?interface=vmbr0&vlan-id=1110"

[post-installation-webhook]
url = "http://proxmox-auto-install-assistant.lan.homelab:8080/api/v1/post-install-events"
