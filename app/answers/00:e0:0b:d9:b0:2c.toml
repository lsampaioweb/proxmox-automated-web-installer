# Seeded from 03-proxmox-cluster host_vars mac_bind.
# Host: pve-07.lan.homelab
# First NIC: enp1board0
# Password hash is rendered from PROXMOX_ROOT_PASSWORD; replace disk-list with a
# stable filter.ID_SERIAL / ID_WWN before a real install. See answers/README.md.
[global]
keyboard = "en-us"
country = "br"
fqdn = "pve-07.lan.homelab"
mailto = "root@pve-07.lan.homelab"
timezone = "America/Sao_Paulo"
root-password-hashed = "__PROXMOX_ROOT_PASSWORD_HASH__"
reboot-on-error = false
reboot-mode = "reboot"

[network]
source = "from-dhcp"

[network.interface-name-pinning]
enabled = true

[network.interface-name-pinning.mapping]
"00:e0:0b:d9:b0:2c" = "enp1board0"
"a0:36:9f:c8:9c:ac" = "enp2lacp0"
"a0:36:9f:c8:9c:ad" = "enp2lacp1"
"a0:36:9f:c8:9c:ae" = "enp2lacp2"
"a0:36:9f:c8:9c:af" = "enp2lacp3"
"a0:36:9f:40:53:3c" = "enp3sync0"
"a0:36:9f:40:53:3e" = "enp3sync1"

[disk-setup]
filesystem = "ext4"
# WARNING: disk-list = ["sda"] is a placeholder. Prefer filter.ID_SERIAL / ID_WWN.
disk-list = ["sda"]
