# Seeded from mac_bind in 03-proxmox-cluster host_vars.
# Host: pve-02.lan.homelab
# Primary NIC: enp1board0
# The service adds the password hash when it renders this file.
[global]
keyboard = "en-us"
country = "br"
fqdn = "pve-02.lan.homelab"
mailto = "root@pve-02.lan.homelab"
timezone = "America/Sao_Paulo"
root-password-hashed = "__PROXMOX_ROOT_PASSWORD_HASH__"
reboot-on-error = false
reboot-mode = "reboot"

[network]
source = "from-dhcp"

[network.interface-name-pinning]
enabled = true

[network.interface-name-pinning.mapping]
"18:c0:4d:f1:fe:c9" = "enp1board0"
"00:e0:4c:68:62:71" = "enp2lacp0"
"00:e0:4c:68:62:72" = "enp2lacp1"
"00:e0:4c:68:62:73" = "enp2lacp2"
"00:e0:4c:68:62:74" = "enp2lacp3"
"a0:36:9f:40:53:60" = "enp3sync0"
"a0:36:9f:40:53:62" = "enp3sync1"

[disk-setup]
filesystem = "ext4"
# Placeholder only: replace disk-list with a stable selector before installation.
disk-list = ["sda"]
