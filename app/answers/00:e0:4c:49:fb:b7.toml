# Seeded from mac_bind in 03-proxmox-cluster host_vars.
# Host: pve-04.lan.homelab
# Primary NIC: enp1board0
# The service adds the password hash when it renders this file.
[global]
keyboard = "en-us"
country = "br"
fqdn = "pve-04.lan.homelab"
mailto = "root@pve-04.lan.homelab"
timezone = "America/Sao_Paulo"
root-password-hashed = "__PROXMOX_ROOT_PASSWORD_HASH__"
reboot-on-error = false
reboot-mode = "reboot"

[network]
source = "from-dhcp"

[network.interface-name-pinning]
enabled = true

[network.interface-name-pinning.mapping]
"00:e0:4c:49:fb:b7" = "enp1board0"
"00:e0:4c:68:03:b3" = "enp2lacp0"
"50:e5:49:ac:39:a4" = "enp2lacp1"
"00:00:00:00:00:05" = "enp2lacp2"
"94:de:80:8e:ef:45" = "enp2lacp3"
"a0:36:9f:40:3d:60" = "enp3sync0"
"a0:36:9f:40:3d:62" = "enp3sync1"

[disk-setup]
filesystem = "ext4"
# Placeholder only: replace disk-list with a stable selector before installation.
disk-list = ["sda"]
