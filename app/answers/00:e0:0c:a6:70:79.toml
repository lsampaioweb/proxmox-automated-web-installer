# Seeded from mac_bind in 03-proxmox-cluster host_vars.
# Host: pve-06.lan.homelab
# Primary NIC: enp1board0
# The service adds the password hash when it renders this file.
[global]
keyboard = "en-us"
country = "br"
fqdn = "pve-06.lan.homelab"
mailto = "root@pve-06.lan.homelab"
timezone = "America/Sao_Paulo"
root-password-hashed = "__PROXMOX_ROOT_PASSWORD_HASH__"
reboot-on-error = false
reboot-mode = "reboot"

[network]
source = "from-dhcp"

[network.interface-name-pinning]
enabled = true

[network.interface-name-pinning.mapping]
"00:e0:0c:a6:70:79" = "enp1board0"
"00:e0:4c:87:1e:94" = "enp2lacp0"
"00:e0:4c:87:1e:95" = "enp2lacp1"
"00:e0:4c:87:1e:96" = "enp2lacp2"
"00:e0:4c:87:1e:97" = "enp2lacp3"
"a0:36:9f:40:46:a0" = "enp3sync0"
"a0:36:9f:40:46:a2" = "enp3sync1"

[disk-setup]
filesystem = "ext4"
# Placeholder only: replace disk-list with a stable selector before installation.
disk-list = ["sda"]

[post-installation-webhook]
url = "http://proxmox-auto-install-assistant.lan.homelab:8080/api/v1/post-install-events"
